plugin:
  name: fylr-scancode-display
  version: 1.0.8
  url: https://github.com/programmfabrik/fylr-plugin-scancode-display
  l10n: l10n/scancode-display.csv
  displayname:
    en-US: "Display Scancodes (Barcode, QRCode)"
    de-DE: "Anzeige von Scancodes (Barcode, QRCode)"
  info:
    de-DE: |
      Ein Custom Mask Splitter für [fylr](https://docs.fylr.io/), der aus den Daten eines anderen Feldes im Datensatz Scancodes erzeugt. Unterstützt werden verschiedene Barcode-Formate sowie QR-Codes, sowohl in Datenmodell-Masken als auch im PDF-Creator.

      - Auswahl zwischen Barcode oder QR-Code und dem konkreten Barcode-Typ
      - Präfix und Suffix um den codierten Wert
      - Auswahl des Quellfelds, dessen Daten codiert werden
      - Optionaler Download-Button (nur in der Maske)

      Setzt das Plugin [fylr PDF Creator](https://github.com/programmfabrik/fylr-plugin-pdf-creator) voraus.
    en-US: |
      A Custom Mask Splitter for [fylr](https://docs.fylr.io/) that renders scancodes from the data of another field in the record. It supports various barcode formats and QR codes, and works both in data-model masks and in the PDF creator.

      - Choose barcode or QR code, and the specific barcode type
      - Add a prefix and suffix around the encoded value
      - Pick the source field whose data is encoded
      - Optionally show a download button (mask only)

      Requires the [fylr PDF Creator](https://github.com/programmfabrik/fylr-plugin-pdf-creator) plugin.
  server:
    api-version:
      require: 1
  webfrontend:
    url: scancode-display.js
    css: scancode-display.css
    dependencies:
      - pdf-creator

base_url_prefix: "webfrontend"
